<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ie2 · micro image editor</title>
<meta name="description" content="Seam carving, chromatic aberration, lens distortion and colour-space roundtripping with sub-pixel control. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='9' fill='%23ff3b5c' fill-opacity='.85'/%3E%3Ccircle cx='19' cy='16' r='9' fill='%2300d1ff' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="r">i</span><span class="g">e</span><span class="b">2</span></div>
  <label class="btn" for="file">Open image</label>
  <input id="file" type="file" accept="image/*,.heic,.heif,.tif,.tiff,.avif,.webp,.bmp,.ico,.svg,.jxl" hidden>
  <div id="meta" class="meta">No image loaded</div>
  <div class="spacer"></div>
  <button id="resetall" class="btn ghost" type="button">Reset all</button>
  <button id="export" class="btn primary" type="button" disabled>Export JPG</button>
</header>

<main>
  <section class="viewer">
    <div class="toolbar">
      <div id="views" class="seg">
        <button data-view="result" class="on" type="button">Result</button>
        <button data-view="original" type="button">Original</button>
        <button data-view="diff" type="button">Diff</button>
        <button data-view="seams" type="button">Seams</button>
        <button data-view="jpeg" type="button" title="Decoded export file — shows what survives compression">JPEG</button>
      </div>
      <label id="ampwrap" class="amp" hidden>Amplify <input id="amp" type="range" min="1" max="128" step="1" value="16"><span id="ampv">×16</span></label>
      <div class="spacer"></div>
      <button id="hold" class="btn ghost small" type="button" title="Hold (or hold Space) to see the original">Hold to compare</button>
      <select id="zoom" title="Zoom">
        <option value="fit">Fit</option>
        <option value="0.5">50%</option>
        <option value="1">100%</option>
        <option value="2">200%</option>
        <option value="4">400%</option>
        <option value="8">800%</option>
        <option value="16">1600%</option>
      </select>
    </div>
    <div id="stage" class="stage fit">
      <div id="wrap" class="wrap">
        <canvas id="view" width="0" height="0"></canvas>
        <canvas id="overlay" class="overlay" hidden></canvas>
        <div id="brushring" class="brushring" hidden></div>
      </div>
      <button id="drop" class="drop" type="button">
        <strong>Drop, paste or click to open an image</strong>
        <span>JPG · PNG · WebP · AVIF · GIF · BMP · SVG · HEIC · TIFF — processed locally, nothing is uploaded</span>
      </button>
    </div>
    <div class="statusbar">
      <div id="bar" class="bar" hidden><i></i></div>
      <span id="status">Ready</span>
      <span id="viewnote" class="viewnote"></span>
    </div>
  </section>

  <aside id="panel" class="panel">
    <nav id="rail" class="rail" aria-label="Stages"></nav>
    <div id="panes" class="panes"></div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
